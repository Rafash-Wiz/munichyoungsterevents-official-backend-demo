spring.application.name=munichyoungsterevents

spring.datasource.url=jdbc:postgresql://localhost:5432/youngster
spring.datasource.username=postgres
spring.datasource.password=Dragonball1!


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#logging.level.root=warn

spring.main.banner-mode=off

# Optional admin bootstrap account (leave empty to disable).
# Example with environment variables:
# app.admin.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
# app.admin.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.admin.bootstrap.email=admin@test.com
app.admin.bootstrap.password=Admin123!

# Pending bookings auto-expire so seats are released if payment/confirmation never happens.
app.booking.pending-expiration-minutes=5
app.booking.pending-expiration-check-ms=60000

# Webhook signature verification (mock mode).
# Keep false for local Postman flows without signature headers.
app.payments.webhook.require-signature=true
app.payments.webhook.mock-valid-signature=dev-webhook-signature
